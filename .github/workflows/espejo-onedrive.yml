# Mantiene el espejo de la Directiva al día leyendo el Word vigente en OneDrive,
# sin depender del PC de Mario. Lee SOLO <proyecto>/AAAA-MM-DD/Directiva/*.docx;
# nunca _entrada/ ni otros insumos. Al repo va solo el espejo de texto.
# Secret: RCLONE_CONF (remoto "onedrive", el mismo de entregas-onedrive).

name: Espejo desde OneDrive

on:
  schedule:
    # Cada hora, de 8:00 a 20:00 de Lima (UTC-5), de lunes a sábado
    - cron: "23 13-23 * * 1-6"
    - cron: "23 0-1 * * 0,2-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: espejo-onedrive
  cancel-in-progress: false

jobs:
  espejo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar rclone (instalador oficial)
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone desde el secret
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::Falta el secret RCLONE_CONF"; exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Regenerar el espejo si el Word cambió
        env:
          # Lo único que cambia de un proyecto a otro (ver PLANTILLA.md)
          PROYECTO: "onedrive:Trabajo/[WORK] - Gobierno IA"
          TIPO: "Directiva"
          NOMBRE: "DIRECTIVA-GOBIERNO-IA"
        run: bash herramientas/espejo-onedrive.sh

      - name: Avisar si falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="El espejo desde OneDrive falló"
          abierto="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$titulo in:title" --json number --jq '.[0].number')"
          cuerpo="La corrida $RUN_URL falló, así que el espejo de la Directiva puede estar desactualizado. Lo más común: la credencial de rclone venció (ver PLANTILLA.md, Límites conocidos). Cierra este aviso cuando vuelva a funcionar."
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --repo "$GITHUB_REPOSITORY" --body "Volvió a fallar: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body "$cuerpo"
          fi
